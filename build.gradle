buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.11.1'
    }
}

plugins {
    id 'org.jetbrains.kotlin.android' version '1.8.0' apply false
}

subprojects {
    repositories {
        google()
        mavenLocal()
        mavenCentral()
    }

    version = '4.3.0'
    group = 'com.journeyapps'

    ext.androidTargetSdk = 35
    ext.zxingCore = 'com.google.zxing:core:3.4.1'
}
